<nav>
  {% for item in site.data.navigation %}
    <a
      href="{{ item.link }}"
      {% if page.url == item.link %}
        style=" color: #007bff;text-decoration: line-through;background-color: #666;"
      {% endif %}
    >
      {{ item.name }}
    </a>
  {% endfor %}
</nav>
